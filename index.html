	<h1>La Stark Varg</h1>
	<p>La Stark Varg es una motocicleta eléctrica diseñada para motocross. Ofrece una conducción potente y silenciosa, y permite ajustar la respuesta del motor. Como no utiliza gasolina, no genera emisiones por el escape y requiere menos mantenimiento que una moto convencional.</p>
